apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tcc-app
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do echo worker-ok $WORKER_MODE; sleep 10; done"]
          env:
            - name: WORKER_MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_MODE
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -n \"$WORKER_MODE\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            privileged: false
