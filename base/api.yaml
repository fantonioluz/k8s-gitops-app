apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tcc-app
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          imagePullPolicy: IfNotPresent
          args:
            - "-text=$(APP_MESSAGE)"
            - "-listen=:8080"
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MESSAGE
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: API_TOKEN
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            privileged: false
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tcc-app
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
